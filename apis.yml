name: Scope
description: 'Scope (Scope Inspection Ltd, London) is an AI-native inspection platform
  for the Testing, Inspection, and Certification (TIC) industry and heavy-asset operators.
  It captures field data through voice, video, and forms (offline-capable), extracts
  structured data from P&IDs, ASME forms, and inspection drawings, surfaces historical
  inspection context, and automates report generation in Word, Excel, and PDF. The
  product pushes results into enterprise CMMS/EAM systems via webhooks and prebuilt
  connectors, but publishes no public developer API, developer portal, OpenAPI, or
  documentation surface at this time. Backed by Index Ventures and Y Combinator; raised
  a ~$18-20M round led by Index Ventures in 2026.'
